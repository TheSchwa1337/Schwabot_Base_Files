# core/config/full_btc_processor_config.yaml

# BTC Processor Master Configuration (v0.046)

# --- General Processor Settings ---
general:
  execution_enabled: true
  window_size: 20                  # For basic price/volume variance checks
  sigma_threshold: 3.0             # 3-sigma rule for delta anomalies

# --- Entropic Vectorization (SHA to Strategy Maps) ---
entropic_vectorizer:
  enabled: true
  output_bits: 16                  # 4-bit class, 8-bit risk, 4-bit xor_drift
  hash_input_composition: "price-volume-blockhash" # Defines what makes up the synthetic hash
  
# --- Triplet Harmony Checker ---
triplet_harmony:
  enabled: true
  coherence_threshold: 0.85        # Minimum score for a triplet to be considered harmonic
  hash_strategy_enabled: true      # Enable hashing of central vector for recall

# --- Drift Shell Differential Dynamics ---
drift_shells:
  enable_fractal_lock: true
  shell_layers: 6                  # Number of drift-shells to track
  delta_n_thresholds:
    lock: 0.001                    # Delta_n threshold for LOCK state
    reset: 0.015                   # Delta_n threshold for REBALANCE/RESET state
  edos_mode: "3-channel"           # EDOS cooling mode (e.g., "3-channel", "linear")
  edos_cooling_factor: 0.90        # Damping coefficient for EDOS
  fractal_ping_interval: "45s"     # Frequency of drift-probe pings

# --- Multi-Timeframe Drift Memory (Profit Backlog) ---
memory_backlog:
  enabled: true
  backlog_depth:
    short_term: 96                 # e.g., 15-min ticks = 24 hours
    mid_term: 672                  # e.g., hourly ticks = 28 days
    long_term: 8760                # e.g., daily ticks = 1 year
  similarity_check: true           # Enable hash similarity checks for recall
  rebalance_trigger: true          # Use backlog insights to trigger rebalance actions
  hash_block_type: "SHA-512"       # Hashing algorithm for backlog vectors
  store_vectors_in: "./memory_bank/profit_vectors/" # Path to store historical vectors
  hash_match_threshold: 0.87       # Min similarity for a hash match
  confidence_decay: 0.008          # Rate at which confidence in old vectors decays
  correlation_matrix_update: "1h"  # How often to update correlation matrix for confluence
  vector_confluence_policy: "weighted_overlap" # Policy for combining similar vectors

# --- GPU Acceleration Settings ---
gpu_acceleration:
  enabled: true
  provider: "cupy"                 # "cupy" or "numpy" (for CPU fallback)

# --- Real-time Pool Tracking ---
pool_tracking:
  enabled: true
  sources:                         # List of Stratum pools to sniff
    - name: "F2Pool"
      host: "stratum.f2pool.com"
      port: 3333
    # - name: "ViaBTC"
    #   host: "stratum.viabtc.com"
    #   port: 3333
    # - name: "SlushPool"
    #   host: "stratum.slushpool.com"
    #   port: 3333
  metrics_window_size: 120         # Window for calculating pool hashrate and gaps (in shares)
  block_feed_url: "wss://mempool.space/api/v1/ws" # WebSocket for block events

# --- Autonomic Strategy Reflex Layer (ASRL) ---
autonomic_strategy_reflex_layer:
  alpha: 0.4                       # Weight for tick_delta_ratio in Unified Reflex Score
  beta: 0.3                        # Weight for coherence_change in Unified Reflex Score
  gamma: 0.3                       # Weight for entropy_surge in Unified Reflex Score
  ur_threshold_mid: 0.3            # Threshold for switching to mid-urgency weights
  ur_threshold_high: 0.6           # Threshold for switching to high-urgency weights
  low_ur_weights:                  # Strategy weights for low urgency (normal market)
    short_term: 0.5
    mid_term: 0.3
    long_term: 0.2
  mid_ur_weights:                  # Strategy weights for medium urgency (moderate volatility)
    short_term: 0.25
    mid_term: 0.5
    long_term: 0.25
  high_ur_weights:                 # Strategy weights for high urgency (high volatility)
    short_term: 0.1
    mid_term: 0.3
    long_term: 0.6

# --- Error Handling & Resilience ---
error_handling:
  enable_soft_logging: true        # Log non-critical errors without halting
  catch_entropy_mismatch: true     # Catch if synthesized entropy doesn't align with expectations
  warn_on_fractal_stall: true      # Warn if drift shells get stuck
  retry_on_hash_drift: 3           # Number of retries for hash synchronization
  critical_flags:                  # System-critical error flags that halt execution
    - "tensor-sync-failure"
    - "drift-shell-reset-loop"
    - "no-realtime-data"

# --- Trade Entry/Exit Parameters (Linked to Profit Vector) ---
trade_entry_exit:
  swing_vector_lock: true          # Enable locking trades to specific swing vectors
  entry_exit_volatility_band: 0.03 # % swing for activation/deactivation
  profit_confidence_ratio: 0.85    # Requires X% hash-match agreement across shells
  tick_correlation:
    min_samples: 8                 # Min samples for tick correlation analysis
    hash_shift_lag: 3              # Lag for hash-based tick correlation
  chart_mirroring_allowed: true    # Allow visual feedback to influence parameters (human-in-loop) 