[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "schwabot"
dynamic = ["version"]
description = "Hardware-scale-aware economic kernel for federated trading devices"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Schwabot Development Team", email = "dev@schwabot.ai"}
]
maintainers = [
    {name = "Schwabot Development Team", email = "dev@schwabot.ai"}
]
keywords = [
    "trading",
    "cryptocurrency", 
    "algorithmic-trading",
    "mathematical-trading",
    "distributed-systems",
    "ai",
    "machine-learning",
    "financial",
    "investment",
    "blockchain",
    "defi"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "statsmodels>=0.13.0",
    "sympy>=1.9.0",
    "asyncio-mqtt>=0.11.0",
    "aiohttp>=3.8.0",
    "websockets>=10.0",
    "psutil>=5.8.0",
    "python-dateutil>=2.8.0",
    "pytz>=2021.1",
    "structlog>=21.1.0",
    "colorama>=0.4.4",
    "pydantic>=1.8.0",
    "typing-extensions>=3.10.0",
    "ujson>=4.0.0",
    "orjson>=3.6.0",
    "cryptography>=3.4.0",
    "memory-profiler>=0.60.0",
    "line-profiler>=3.3.0",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "PyYAML>=5.4.0",
    "toml>=0.10.0",
    "requests>=2.25.0",
    "urllib3>=1.26.0",
    "python-dotenv>=0.19.0",
    "configparser>=5.0.0",
    "pathlib2>=2.3.0",
    "watchdog>=2.1.0",
    "Flask>=2.0.0",
    "Flask-SocketIO>=5.1.0",
    "Flask-CORS>=3.0.10",
    "python-socketio>=5.1.0",
    "ccxt>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-asyncio>=0.15.0", 
    "pytest-cov>=2.12.0",
    "flake8>=3.9.0",
    "black>=21.0.0",
    "isort>=5.9.0",
    "mypy>=0.910",
    "pre-commit>=2.15.0",
]
gpu = [
    "torch>=1.9.0",
    "tensorflow>=2.6.0",
    "cupy-cuda11x>=9.0.0",
]
ml = [
    "scikit-learn>=1.0.0",
    "statsmodels>=0.13.0",
    "sympy>=1.9.0",
    "numba>=0.56.0",
    "cython>=0.29.0",
]
monitoring = [
    "prometheus-client>=0.11.0",
    "grafana-api>=1.0.0",
    "sentry-sdk>=1.3.0",
    "rollbar>=0.16.0",
]
database = [
    "sqlalchemy>=1.4.0",
    "redis>=3.5.0",
]
visualization = [
    "plotly>=5.0.0",
    "bokeh>=2.3.0",
]

[project.scripts]
schwabot = "run_schwabot:main"
schwabot-dashboard = "ui.schwabot_dashboard:main"
schwabot-validate = "system_validation:main"
schwabot-test = "test_mathematical_integration:main"
schwabot-cli = "core.cli:main"

[project.gui-scripts]
schwabot-gui = "ui.schwabot_dashboard:main"

[project.urls]
Homepage = "https://github.com/schwabot/schwabot"
Documentation = "https://schwabot.readthedocs.io/"
Repository = "https://github.com/schwabot/schwabot"
"Bug Tracker" = "https://github.com/schwabot/schwabot/issues"
Changelog = "https://github.com/schwabot/schwabot/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = [
    "core",
    "ui", 
    "config",
    "utils",
    "mathlib",
    "ncco_core",
    "tests",
    "docs",
    "examples",
    "scripts",
    "tools"
]

[tool.setuptools.package-data]
"*" = [
    "*.yaml",
    "*.yml", 
    "*.json",
    "*.md",
    "*.txt",
    "*.ini",
    "*.cfg",
    "templates/*",
    "static/*",
    "config/*",
    "logs/*"
]

[tool.setuptools_scm]
write_to = "schwabot/_version.py"
fallback_version = "2.0.0"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["core", "ui", "config", "utils", "mathlib", "ncco_core"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
    "sklearn.*",
    "statsmodels.*",
    "sympy.*",
    "torch.*",
    "tensorflow.*",
    "flask.*",
    "requests.*",
    "ccxt.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
    "core",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "mathematical: marks tests as mathematical validation tests",
]

[tool.coverage.run]
source = ["core", "ui", "config", "utils"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".mypy_cache",
    ".tox",
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101", "B601"]

[tool.safety]
output = "json" 