[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schwabot"
version = "1.0.0"
description = "Advanced cryptocurrency trading bot with unified mathematics framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Schwabot Development Team", email = "dev@schwabot.ai"}
]
maintainers = [
    {name = "Schwabot Development Team", email = "dev@schwabot.ai"}
]
keywords = [
    "trading",
    "cryptocurrency",
    "bitcoin", 
    "algorithmic-trading",
    "quantitative-finance",
    "machine-learning",
    "mathematics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.9.0,<2.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    "requests>=2.28.0,<3.0.0",
    "pandas>=1.5.0,<3.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "flask>=2.2.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=1.10.0,<3.0.0",
    "psutil>=5.9.0,<6.0.0",
    "cryptography>=37.0.0,<42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "black>=22.0.0,<24.0.0",
    "isort>=5.10.0,<6.0.0",
    "flake8>=5.0.0,<7.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pre-commit>=2.20.0,<4.0.0"
]
ml = [
    "scikit-learn>=1.1.0,<2.0.0",
    "torch>=1.12.0,<3.0.0",
    "tensorflow>=2.9.0,<3.0.0"
]
viz = [
    "plotly>=5.10.0,<6.0.0",
    "bokeh>=2.4.0,<4.0.0",
    "seaborn>=0.11.0,<1.0.0"
]
crypto = [
    "ccxt>=4.0.0,<5.0.0"
]
docs = [
    "sphinx>=5.0.0,<8.0.0",
    "sphinx-rtd-theme>=1.2.0,<2.0.0",
    "myst-parser>=0.18.0,<2.0.0"
]

[project.urls]
"Homepage" = "https://github.com/schwabot/schwabot"
"Bug Reports" = "https://github.com/schwabot/schwabot/issues"
"Source" = "https://github.com/schwabot/schwabot"
"Documentation" = "https://schwabot.readthedocs.io/"

[project.scripts]
schwabot = "schwabot_enhanced_launcher:main"
schwabot-test = "test_schwabot_integration:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "utils*", "schwabot*"]
exclude = ["tests*", "docs*", "build*", "dist*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["core", "utils", "schwabot"]
known_third_party = ["numpy", "pandas", "matplotlib", "aiohttp", "requests", "flask"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "W504"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".env",
    "build",
    "dist",
    "*.egg-info"
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101,S105,S106,S107"
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*", 
    "pandas.*",
    "matplotlib.*",
    "aiohttp.*",
    "requests.*",
    "ccxt.*",
    "pydantic.*",
    "cryptography.*",
    "psutil.*",
    "yaml.*",
    "toml.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=core",
    "--cov=utils",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["core", "utils", "."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "build/*",
    "dist/*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
] 