# Schwabot MyPy Configuration - Enhanced Type Enforcement
# Enforces strict type checking for mathematical and trading systems
# Version: 0.5.1

[mypy]
# Global mypy configuration for Schwabot
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Show error codes
show_error_codes = True

# Exclude certain directories
exclude = (?x)(
    # Exclude directories
    .git/|
    __pycache__/|
    docs/|
    venv/|
    .venv/|
    alembic/|
    migrations/
)

# Per-module options
[mypy-core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_calls = True
ignore_errors = False
ignore_missing_imports = True

[mypy-core.phantom_lag_model]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.meta_layer_ghost_bridge]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.fallback_logic_router]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.hash_registry_manager]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.tensor_harness_matrix]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.voltage_lane_mapper]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.system_integration_orchestrator]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Third-party library configurations
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-seaborn.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-tensorflow.*]
ignore_missing_imports = True

[mypy-flask.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-ccxt.*]
ignore_missing_imports = True

[mypy-binance.*]
ignore_missing_imports = True

[mypy-coinbase.*]
ignore_missing_imports = True

[mypy-kraken.*]
ignore_missing_imports = True

# Test files can be more lenient
[mypy-test_*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-*test*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Configuration files
[mypy-config.*]
disallow_untyped_defs = False
ignore_missing_imports = True

# Target directories (removed non-existent services/)
files = core/, tests/, utils/, engine/

# Enhanced type checking
warn_redundant_casts = True
warn_unreachable = True
warn_no_return = True
check_untyped_defs = True
disallow_any_generics = True
disallow_subclassing_any = True
no_implicit_reexport = True
strict_equality = True

# Plugin support
plugins = pydantic.mypy

# Cache results for faster subsequent runs
cache_dir = .mypy_cache

