# Schwabot MyPy Configuration - Enhanced Type Enforcement
# Enforces strict type checking for mathematical and trading systems
# Version: 0.5.1

[mypy]
# Global mypy configuration for Schwabot UROS v1.0
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True
show_column_numbers = True
show_error_context = True
pretty = True

# Ignore missing imports for optional dependencies
ignore_missing_imports = True

# Per-module settings
[mypy-core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-core.bit_phase_engine]
disallow_untyped_defs = True

[mypy-core.tensor_router]
disallow_untyped_defs = True

[mypy-core.phase_entropy_matcher]
disallow_untyped_defs = True

[mypy-core.matrix_mapper]
disallow_untyped_defs = True

[mypy-core.profit_cycle_allocator]
disallow_untyped_defs = True

[mypy-core.gpu_offload_manager]
disallow_untyped_defs = True

[mypy-core.dlt_waveform_engine]
disallow_untyped_defs = True

[mypy-core.demo_trading_system]
disallow_untyped_defs = True

[mypy-core.mathematical_integration_validator]
disallow_untyped_defs = True

# Third-party library configurations
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-cupy.*]
ignore_missing_imports = True

[mypy-numba.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-hashlib]
ignore_missing_imports = True

[mypy-time]
ignore_missing_imports = True

[mypy-json]
ignore_missing_imports = True

[mypy-datetime]
ignore_missing_imports = True

[mypy-dataclasses]
ignore_missing_imports = True

[mypy-typing]
ignore_missing_imports = True

[mypy-logging]
ignore_missing_imports = True

[mypy-math]
ignore_missing_imports = True

[mypy-enum]
ignore_missing_imports = True

# Test files
[mypy-test_*]
disallow_untyped_defs = False
check_untyped_defs = False

# Configuration files
[mypy-config.*]
disallow_untyped_defs = False

# Target directories (removed non-existent services/)
files = core/, tests/, utils/, engine/

# Enhanced type checking
warn_redundant_casts = True
warn_unreachable = True
warn_no_return = True
check_untyped_defs = True
disallow_any_generics = True
disallow_subclassing_any = True
no_implicit_reexport = True
strict_equality = True

# Plugin support
plugins = pydantic.mypy

# Cache results for faster subsequent runs
cache_dir = .mypy_cache

# Per-module settings
[mypy-core.*]
ignore_errors = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True

