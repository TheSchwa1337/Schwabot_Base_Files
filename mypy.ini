# Schwabot MyPy Configuration - Enhanced Type Enforcement
# Enforces strict type checking for mathematical and trading systems
# Version: 0.6.0

[mypy]
# Global mypy configuration for Schwabot Advanced Dualistic Trading System

# Python version
python_version = 3.8

# Strict mode settings
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
strict_equality = True

# Error codes to ignore (if needed)
# disable_error_code = attr-defined

# Files to include/exclude
exclude = 
    .*_test\.py,
    .*test_.*\.py,
    tests/.*,
    __pycache__,
    \.mypy_cache,
    \.pytest_cache

# Per-module options
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-ccxt.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True

# Core modules that should be strictly typed
[mypy-core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-utils.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Configuration for mathematical modules
[mypy-core.advanced_tensor_algebra]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.unified_math_system]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Allow some flexibility for API modules that might have external dependencies
[mypy-core.api.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Show error codes
show_error_codes = True

# Target directories
files = core/, utils/, *.py

# Enhanced type checking
warn_redundant_casts = True
warn_unreachable = True
warn_no_return = True
check_untyped_defs = True
disallow_any_generics = True
disallow_subclassing_any = True
no_implicit_reexport = True
strict_equality = True

# Cache results for faster subsequent runs
cache_dir = .mypy_cache

# Core Schwabot modules - strict enforcement
[mypy-schwabot_unified_math]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
warn_return_any = True

[mypy-schwabot_enhanced_launcher]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True

[mypy-core.*]
disallow_untyped_defs = True
