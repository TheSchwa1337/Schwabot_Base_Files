# Schwabot Configuration File
# Complete system configuration for production deployment

# =============================================================================
# CORE SYSTEM CONFIGURATION
# =============================================================================

system:
  name: "Schwabot Trading System"
  version: "2.0.0"
  environment: "production"  # development, staging, production
  debug_mode: false
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  max_memory_usage_mb: 8192
  cpu_threads: 4
  enable_gpu_acceleration: true
  enable_distributed_mode: true

# =============================================================================
# MATHEMATICAL COMPONENTS CONFIGURATION
# =============================================================================

mathematical_components:
  phantom_lag_model:
    enabled: true
    max_history_size: 1000
    decay_lambda: 0.01
    min_penalty_threshold: 0.1
    max_price_window: 100
    enable_adaptive_learning: true
    learning_rate: 0.1
    
  meta_layer_ghost_bridge:
    enabled: true
    decay_lambda: 0.1
    sync_threshold: 0.002
    max_echo_entries: 1000
    max_bridge_opportunities: 100
    enable_arbitrage_detection: true
    min_profit_threshold: 0.001
    
  fallback_logic_router:
    enabled: true
    max_history_size: 1000
    health_decay_rate: 0.1
    enable_mathematical_integration: true
    enable_context_aware_routing: true

# =============================================================================
# TRADING CONFIGURATION
# =============================================================================

trading:
  default_symbol: "BTC/USD"
  supported_symbols:
    - "BTC/USD"
    - "ETH/USD"
    - "ADA/USD"
    - "DOT/USD"
    - "LINK/USD"
  
  position_sizing:
    max_position_size_usd: 10000
    min_position_size_usd: 100
    risk_per_trade_pct: 2.0
    max_portfolio_risk_pct: 10.0
    
  execution:
    enable_real_trading: false  # Set to true for live trading
    max_slippage_pct: 0.5
    execution_timeout_seconds: 30
    retry_attempts: 3
    enable_smart_order_routing: true
    
  risk_management:
    max_daily_loss_usd: 1000
    max_drawdown_pct: 15.0
    stop_loss_pct: 5.0
    take_profit_pct: 10.0
    enable_trailing_stops: true
    trailing_stop_distance_pct: 2.0

# =============================================================================
# EXCHANGE CONFIGURATION
# =============================================================================

exchanges:
  binance:
    enabled: true
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
    sandbox_mode: true
    rate_limit_requests_per_minute: 1200
    enable_websocket: true
    
  coinbase:
    enabled: true
    api_key: "${COINBASE_API_KEY}"
    api_secret: "${COINBASE_API_SECRET}"
    sandbox_mode: true
    rate_limit_requests_per_minute: 100
    enable_websocket: true
    
  kraken:
    enabled: true
    api_key: "${KRAKEN_API_KEY}"
    api_secret: "${KRAKEN_API_SECRET}"
    sandbox_mode: true
    rate_limit_requests_per_minute: 15
    enable_websocket: true

# =============================================================================
# DATA FEED CONFIGURATION
# =============================================================================

data_feeds:
  tick_feed:
    enabled: true
    update_interval_ms: 100
    max_history_size: 10000
    enable_real_time_streaming: true
    
  market_data:
    enabled: true
    sources:
      - "binance"
      - "coinbase"
      - "kraken"
    aggregation_method: "weighted_average"
    enable_arbitrage_detection: true
    
  news_feed:
    enabled: true
    sources:
      - "cryptopanic"
      - "coindesk"
      - "cointelegraph"
    sentiment_analysis: true
    impact_threshold: 0.3

# =============================================================================
# STRATEGY CONFIGURATION
# =============================================================================

strategies:
  conservative:
    enabled: true
    risk_tolerance: "low"
    max_position_size_pct: 5.0
    stop_loss_pct: 3.0
    take_profit_pct: 8.0
    
  moderate:
    enabled: true
    risk_tolerance: "medium"
    max_position_size_pct: 10.0
    stop_loss_pct: 5.0
    take_profit_pct: 12.0
    
  aggressive:
    enabled: true
    risk_tolerance: "high"
    max_position_size_pct: 20.0
    stop_loss_pct: 8.0
    take_profit_pct: 20.0

# =============================================================================
# PERFORMANCE MONITORING
# =============================================================================

monitoring:
  performance_metrics:
    enabled: true
    collection_interval_seconds: 60
    retention_days: 30
    enable_real_time_dashboard: true
    
  alerts:
    enabled: true
    channels:
      - "email"
      - "slack"
      - "telegram"
    alert_types:
      - "high_loss"
      - "system_error"
      - "exchange_disconnect"
      - "performance_degradation"
      
  logging:
    enabled: true
    log_file_path: "./logs/schwabot.log"
    max_file_size_mb: 100
    backup_count: 10
    enable_structured_logging: true

# =============================================================================
# UI CONFIGURATION
# =============================================================================

user_interface:
  web_dashboard:
    enabled: true
    host: "0.0.0.0"
    port: 8080
    enable_ssl: false
    ssl_cert_path: ""
    ssl_key_path: ""
    
  api_server:
    enabled: true
    host: "0.0.0.0"
    port: 8081
    enable_authentication: true
    api_key_header: "X-API-Key"
    rate_limit_requests_per_minute: 100
    
  real_time_updates:
    enabled: true
    websocket_port: 8082
    update_interval_ms: 1000
    enable_compression: true

# =============================================================================
# DISTRIBUTED SYSTEM CONFIGURATION
# =============================================================================

distributed_system:
  coordinator:
    enabled: true
    host: "0.0.0.0"
    port: 8083
    enable_auto_discovery: true
    heartbeat_interval_seconds: 30
    
  clients:
    max_clients: 100
    enable_load_balancing: true
    health_check_interval_seconds: 60
    
  hardware_tiers:
    chromebook:
      max_memory_mb: 2048
      cpu_threads: 2
      enable_gpu: false
      
    raspberry_pi:
      max_memory_mb: 1024
      cpu_threads: 4
      enable_gpu: false
      
    gaming_laptop:
      max_memory_mb: 8192
      cpu_threads: 8
      enable_gpu: true
      
    server:
      max_memory_mb: 32768
      cpu_threads: 16
      enable_gpu: true

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================

security:
  encryption:
    enabled: true
    algorithm: "AES-256-GCM"
    key_rotation_days: 30
    
  authentication:
    enabled: true
    method: "api_key"  # api_key, jwt, oauth
    session_timeout_hours: 24
    
  network:
    enable_firewall: true
    allowed_ips: []
    enable_rate_limiting: true
    max_connections_per_ip: 100

# =============================================================================
# BACKUP AND RECOVERY
# =============================================================================

backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  compression: true
  encryption: true
  
  data_types:
    - "configuration"
    - "trading_history"
    - "performance_metrics"
    - "logs"

# =============================================================================
# DEVELOPMENT AND TESTING
# =============================================================================

development:
  enable_hot_reload: false
  enable_debug_endpoints: false
  enable_mock_data: false
  enable_backtesting: true
  
  testing:
    enable_unit_tests: true
    enable_integration_tests: true
    enable_performance_tests: true
    test_coverage_threshold: 80.0

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================

environment_variables:
  required:
    - "BINANCE_API_KEY"
    - "BINANCE_API_SECRET"
    - "COINBASE_API_KEY"
    - "COINBASE_API_SECRET"
    - "KRAKEN_API_KEY"
    - "KRAKEN_API_SECRET"
    
  optional:
    - "SLACK_WEBHOOK_URL"
    - "TELEGRAM_BOT_TOKEN"
    - "EMAIL_SMTP_SERVER"
    - "EMAIL_USERNAME"
    - "EMAIL_PASSWORD"