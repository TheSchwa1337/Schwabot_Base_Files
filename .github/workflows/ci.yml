name: Lint and Type Check

on: [push, pull_request]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run flake8
        run: flake8 core/ schwabot/ apply_enhanced_cli_compatibility.py --max-line-length=100 --count
      - name: Run mypy
        run: mypy core/ schwabot/ apply_enhanced_cli_compatibility.py
      - name: Run black (check only)
        run: black --check core/ schwabot/ apply_enhanced_cli_compatibility.py
      - name: Run isort (check only)
        run: isort --check-only core/ schwabot/ apply_enhanced_cli_compatibility.py
